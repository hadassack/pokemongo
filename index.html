<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiGame - Pokédex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE ABERTURA (SPLASH SCREEN) -->
    <div id="splash-screen">
        <div class="splash-circle">
            <!-- Substituído temporariamente por ícone ou imagem representativa do Charizard bebê -->
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.html" alt="Baby Charizard" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png'">
            <h2>WikiGame</h2>
            <div class="loader-bar"><div></div></div>
        </div>
    </div>

    <!-- SITE PRINCIPAL -->
    <header>
        <h1 class="logo">Wiki<span>Game</span></h1>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Digite o nome ou ID do Pokémon...">
            <button id="search-btn">Buscar</button>
        </div>
    </header>

    <main>
        <!-- SEÇÃO DO POKÉMON PESQUISADO -->
        <section class="pokedex-section">
            <div id="pokemon-card" class="card">
                <!-- Conteúdo injetado via JS -->
            </div>
        </section>

        <!-- SEÇÃO DE BATALHA / COMPARAÇÃO -->
        <section class="battle-section">
            <h2>Simulador de Batalha</h2>
            <div class="battle-inputs">
                <input type="text" id="poke1-input" placeholder="Pokémon 1 (ex: Charizard)">
                <span class="vs-text">VS</span>
                <input type="text" id="poke2-input" placeholder="Pokémon 2 (ex: Blastoise)">
            </div>
            <button id="battle-btn">Comparar Batalha</button>
            
            <div id="battle-result" class="battle-arena hidden">
                <div class="fighter" id="fighter-1"></div>
                <div class="vs-badge">VS</div>
                <div class="fighter" id="fighter-2"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 WikiGame. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
