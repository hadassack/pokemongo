<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WikiGame | Pokémon</title>

    <!-- FONTE DO LOGO -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================
           CONFIGURAÇÕES GERAIS
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            background: #000000;
            color: white;

            overflow: hidden;
        }


        /* =========================================
           ABERTURA
        ========================================= */

        #intro {

            position: fixed;
            inset: 0;

            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000000;

            overflow: hidden;
        }


        /* =========================================
           PARTÍCULAS
        ========================================= */

        .particles {

            position: absolute;
            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }

        .particle {

            position: absolute;

            width: 4px;
            height: 4px;

            background: #ff7900;

            border-radius: 50%;

            box-shadow:
                0 0 6px #ff7900,
                0 0 12px rgba(255, 121, 0, .6);

            opacity: 0;

            animation: particleGlow 3s infinite;
        }


        .particle:nth-child(1) {
            top: 18%;
            left: 12%;
            animation-delay: .2s;
        }

        .particle:nth-child(2) {
            top: 28%;
            left: 83%;
            animation-delay: 1.1s;
        }

        .particle:nth-child(3) {
            top: 73%;
            left: 16%;
            animation-delay: 2s;
        }

        .particle:nth-child(4) {
            top: 82%;
            left: 78%;
            animation-delay: .7s;
        }

        .particle:nth-child(5) {
            top: 10%;
            left: 66%;
            animation-delay: 1.5s;
        }

        .particle:nth-child(6) {
            top: 60%;
            left: 92%;
            animation-delay: 2.4s;
        }

        .particle:nth-child(7) {
            top: 46%;
            left: 7%;
            animation-delay: .9s;
        }

        .particle:nth-child(8) {
            top: 89%;
            left: 47%;
            animation-delay: 1.8s;
        }


        @keyframes particleGlow {

            0%,
            100% {
                opacity: 0;
                transform: scale(.3);
            }

            50% {
                opacity: .9;
                transform: scale(1.5);
            }
        }


        /* =========================================
           CONTEÚDO CENTRAL
        ========================================= */

        .intro-content {

            position: relative;

            z-index: 5;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;
        }


        /* =========================================
           CÍRCULO LARANJA
        ========================================= */

        .orange-circle {

            position: relative;

            width: 260px;
            height: 260px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 28%,

                    #ffd17b 0%,
                    #ffb23c 22%,
                    #ff8a00 48%,
                    #ff6500 75%,
                    #d84300 100%
                );

            box-shadow:

                0 0 20px rgba(255, 117, 0, .8),

                0 0 55px rgba(255, 92, 0, .42),

                0 0 110px rgba(255, 78, 0, .15);


            opacity: 0;

            transform: scale(.1);

            animation:

                circleEnter
                1.25s
                cubic-bezier(.17,.84,.44,1)
                forwards,

                circleFloat
                3.2s
                ease-in-out
                1.3s
                infinite;
        }


        /* PRIMEIRO ANEL */

        .orange-circle::before {

            content: "";

            position: absolute;

            inset: -14px;

            border-radius: 50%;

            border:
                2px solid
                rgba(255, 125, 0, .35);

            animation:
                ringPulse
                2.4s
                ease-in-out
                infinite;
        }


        /* SEGUNDO ANEL */

        .orange-circle::after {

            content: "";

            position: absolute;

            inset: -31px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 125, 0, .15);

            animation:
                ringPulse
                2.4s
                ease-in-out
                .5s
                infinite;
        }


        @keyframes circleEnter {

            0% {

                opacity: 0;

                transform:
                    scale(.1)
                    rotate(-15deg);

                filter: blur(12px);
            }


            70% {

                opacity: 1;

                transform:
                    scale(1.08)
                    rotate(2deg);

                filter: blur(0);
            }


            100% {

                opacity: 1;

                transform:
                    scale(1);

                filter: blur(0);
            }
        }


        @keyframes circleFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-9px);
            }
        }


        @keyframes ringPulse {

            0%,
            100% {

                transform: scale(.96);

                opacity: .25;
            }

            50% {

                transform: scale(1.06);

                opacity: .85;
            }
        }


        /* =========================================
           PERSONAGEM TEMPORÁRIO
        ========================================= */

        .baby-charizard {

            position: relative;

            z-index: 2;

            font-size: 105px;

            filter:
                drop-shadow(
                    0 8px 12px
                    rgba(90, 25, 0, .4)
                );

            opacity: 0;

            transform:
                translateY(30px)
                scale(.5);

            animation:
                characterEnter
                .9s
                ease
                1s
                forwards;
        }


        @keyframes characterEnter {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(.5);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================================
           LOGO WIKIGAME
        ========================================= */

        .logo {

            margin-top: 42px;

            font-family:
                "Orbitron",
                sans-serif;

            font-size:
                clamp(
                    42px,
                    7vw,
                    72px
                );

            font-weight: 900;

            letter-spacing: 5px;

            color: #ff7900;

            text-transform: uppercase;

            text-shadow:

                0 0 7px
                rgba(255, 121, 0, .65),

                0 0 18px
                rgba(255, 91, 0, .35);


            opacity: 0;

            transform:
                translateY(25px);

            animation:
                logoEnter
                .8s
                cubic-bezier(.2,.8,.2,1)
                1.8s
                forwards;
        }


        /* WIKI E GAME AGORA TÊM A MESMA COR */

        .logo span {

            color: #ff7900;
        }


        @keyframes logoEnter {

            from {

                opacity: 0;

                transform:
                    translateY(25px);

                letter-spacing: 12px;
            }


            to {

                opacity: 1;

                transform:
                    translateY(0);

                letter-spacing: 5px;
            }
        }


        /* =========================================
           SUBTÍTULO
        ========================================= */

        .subtitle {

            margin-top: 12px;

            font-family:
                "Orbitron",
                sans-serif;

            color: #7e7e7e;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 5px;

            text-transform: uppercase;

            opacity: 0;

            animation:
                subtitleEnter
                .8s
                ease
                2.35s
                forwards;
        }


        @keyframes subtitleEnter {

            to {
                opacity: 1;
            }
        }


        /* =========================================
           LOADING
        ========================================= */

        .loader {

            width: min(280px, 70vw);

            height: 3px;

            margin-top: 32px;

            background:
                rgba(255, 255, 255, .08);

            border-radius: 100px;

            overflow: hidden;

            opacity: 0;

            animation:
                loaderAppear
                .4s
                ease
                2.6s
                forwards;
        }


        .loader-bar {

            width: 0;

            height: 100%;

            border-radius: 100px;

            background:
                linear-gradient(
                    90deg,
                    #ff5100,
                    #ff7900,
                    #ffb52e
                );

            box-shadow:
                0 0 15px
                rgba(255, 121, 0, .8);

            animation:
                loading
                3.1s
                ease
                2.8s
                forwards;
        }


        @keyframes loaderAppear {

            to {
                opacity: 1;
            }
        }


        @keyframes loading {

            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }


        /* =========================================
           BOTÃO PULAR
        ========================================= */

        #skipIntro {

            position: absolute;

            right: 28px;
            bottom: 25px;

            z-index: 20;

            padding:
                11px 18px;

            font-family:
                "Orbitron",
                sans-serif;

            font-size: 11px;

            letter-spacing: .5px;

            color:
                rgba(255,255,255,.62);

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.13);

            border-radius: 100px;

            cursor: pointer;

            transition:
                transform .25s,
                color .25s,
                border-color .25s,
                background .25s;
        }


        #skipIntro:hover {

            color: #ff8a00;

            border-color:
                rgba(255, 122, 0, .6);

            background:
                rgba(255, 122, 0, .08);

            transform:
                translateY(-3px);
        }


        /* =========================================
           SAÍDA DA INTRO
        ========================================= */

        #intro.intro-out {

            animation:
                introOut
                .9s
                ease
                forwards;
        }


        @keyframes introOut {

            from {

                opacity: 1;

                transform:
                    scale(1);
            }

            to {

                opacity: 0;

                transform:
                    scale(1.03);

                visibility: hidden;
            }
        }


        /* =========================================
           HOME TEMPORÁRIA
        ========================================= */

        #site {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding:
                40px 20px;

            background: #000000;

            opacity: 0;

            transform:
                scale(1.02);

            transition:

                opacity .8s ease,

                transform .8s ease;
        }


        #site.visible {

            opacity: 1;

            transform:
                scale(1);
        }


        .home-logo {

            font-family:
                "Orbitron",
                sans-serif;

            font-size:
                clamp(
                    43px,
                    7vw,
                    76px
                );

            font-weight: 900;

            letter-spacing: 4px;

            color: #ff7900;

            text-shadow:
                0 0 15px
                rgba(255, 121, 0, .3);
        }


        .home-description {

            max-width: 650px;

            margin-top: 18px;

            color: #8f8f8f;

            text-align: center;

            font-size: 16px;

            line-height: 1.7;
        }


        .home-buttons {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 15px;

            margin-top: 35px;
        }


        .home-button {

            padding:
                14px 25px;

            border-radius: 10px;

            font-family:
                "Orbitron",
                sans-serif;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            transition: .25s;
        }


        .primary {

            border: none;

            color: #000000;

            background:
                linear-gradient(
                    135deg,
                    #ffad28,
                    #ff6a00
                );
        }


        .secondary {

            color: #ff7900;

            background:
                transparent;

            border:
                1px solid
                rgba(255, 121, 0, .45);
        }


        .home-button:hover {

            transform:
                translateY(-4px);
        }


        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 600px) {

            .orange-circle {

                width: 205px;
                height: 205px;
            }


            .baby-charizard {

                font-size: 82px;
            }


            .logo {

                letter-spacing: 3px;
            }


            .subtitle {

                font-size: 9px;

                letter-spacing: 3px;
            }


            #skipIntro {

                right: 15px;
                bottom: 15px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         ABERTURA
    ========================================== -->

    <section id="intro">


        <!-- PARTÍCULAS -->

        <div class="particles">

            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>

            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>

        </div>


        <!-- CONTEÚDO -->

        <div class="intro-content">


            <!-- CÍRCULO -->

            <div class="orange-circle">


                <!--
                    TEMPORÁRIO

                    O 🔥 será substituído
                    pelo Charizard bebê.
                -->

                <div class="baby-charizard">

                    🔥

                </div>


            </div>


            <!-- LOGO -->

            <div class="logo">

                <span>WIKI</span><span>GAME</span>

            </div>


            <!-- FRASE -->

            <div class="subtitle">

                Explore • Descubra • Batalhe

            </div>


            <!-- LOADING -->

            <div class="loader">

                <div class="loader-bar"></div>

            </div>


        </div>


        <!-- PULAR -->

        <button id="skipIntro">

            Pular abertura →

        </button>


    </section>



    <!-- =========================================
         SITE PRINCIPAL
    ========================================== -->

    <main id="site">


        <div class="home-logo">

            WIKIGAME

        </div>


        <p class="home-description">

            Explore o mundo Pokémon, descubra informações
            sobre seus Pokémon favoritos e prepare seu time
            para batalhas.

        </p>


        <div class="home-buttons">


            <button class="home-button primary">

                Explorar Pokédex

            </button>


            <button class="home-button secondary">

                ⚔ Batalhar

            </button>


        </div>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        const intro =
            document.getElementById("intro");

        const site =
            document.getElementById("site");

        const skipButton =
            document.getElementById("skipIntro");


        let introFinished = false;


        function finishIntro() {


            if (introFinished) {

                return;

            }


            introFinished = true;


            intro.classList.add(
                "intro-out"
            );


            setTimeout(() => {


                intro.style.display =
                    "none";


                site.classList.add(
                    "visible"
                );


                document.body.style.overflow =
                    "auto";


            }, 850);

        }



        /* =========================================
           FINAL AUTOMÁTICO
        ========================================== */


        const introTimer =
            setTimeout(() => {


                finishIntro();


            }, 6500);



        /* =========================================
           PULAR ABERTURA
        ========================================== */


        skipButton.addEventListener(
            "click",
            () => {


                clearTimeout(
                    introTimer
                );


                finishIntro();


            }
        );


    </script>


</body>

</html>
