<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WikiGame | Pokémon</title>

    <!-- FONTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css?v=3">
</head>


<body>

  <!-- =========================================
     ABERTURA WIKIGAME
========================================== -->

<div id="wikigame-intro" class="wikigame-intro">

    <button id="skip-intro" class="skip-intro">
        PULAR
    </button>

    <div class="intro-glow"></div>

    <div class="intro-center">

        <div class="intro-circle">

            <div class="intro-charizard">
                🔥
            </div>

        </div>

        <h1 class="intro-logo">
            WikiGame
        </h1>

        <p class="intro-subtitle">
            CATCH • TRAIN • BATTLE
        </p>

    </div>

</div>

    <section class="hero-wikigame">

        <div class="hero-overlay"></div>


        <!-- PARTÍCULAS ANIMADAS -->

        <div class="particles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>


        <!-- CONTEÚDO CENTRAL -->

        <div class="hero-content">

            <p class="hero-kicker">
                EXPLORE O MUNDO
            </p>


            <h1 class="hero-title">
                POKÉMON
            </h1>


            <p class="hero-description">
                Descubra informações sobre seus Pokémon favoritos,
                monte seu time e prepare-se para batalhas épicas.
            </p>


            <a
                href="#pokemon"
                class="hero-button"
            >
                COMEÇAR AGORA

                <span>
                    →
                </span>
            </a>


            <!-- INFORMAÇÕES -->

            <div class="hero-stats">

                <div class="hero-stat">
                    <strong>
                        +1.000
                    </strong>

                    <span>
                        Pokémon
                    </span>
                </div>


                <div class="hero-stat">
                    <strong>
                        Wiki
                    </strong>

                    <span>
                        Informações completas
                    </span>
                </div>


                <div class="hero-stat">
                    <strong>
                        Times
                    </strong>

                    <span>
                        Monte sua equipe
                    </span>
                </div>


                <div class="hero-stat">
                    <strong>
                        VS
                    </strong>

                    <span>
                        Batalhas
                    </span>
                </div>

            </div>

        </div>


        <!-- SETA -->

        <div class="hero-scroll">
            ↓
        </div>

    </section>


    <!-- =========================================
         PRÓXIMA ÁREA DO SITE
    ========================================== -->

    <section id="pokemon">
    </section>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
