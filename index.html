<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WikiGame | Pokémon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #080b16;
            color: white;
        }

        body {
            overflow: hidden;
        }

        /* =========================================
           ABERTURA
        ========================================= */

        #intro {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #24233c 0%,
                    #111426 42%,
                    #080b16 72%,
                    #03050b 100%
                );

            overflow: hidden;
        }

        /* Pequenas estrelas/partículas */

        .stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;
            background: white;

            opacity: 0;

            animation: starAnimation 3s infinite;
        }

        .star:nth-child(1) {
            top: 15%;
            left: 10%;
            animation-delay: .3s;
        }

        .star:nth-child(2) {
            top: 30%;
            left: 80%;
            animation-delay: 1.2s;
        }

        .star:nth-child(3) {
            top: 72%;
            left: 17%;
            animation-delay: 2s;
        }

        .star:nth-child(4) {
            top: 82%;
            left: 75%;
            animation-delay: .8s;
        }

        .star:nth-child(5) {
            top: 12%;
            left: 65%;
            animation-delay: 1.6s;
        }

        .star:nth-child(6) {
            top: 60%;
            left: 90%;
            animation-delay: 2.5s;
        }

        .star:nth-child(7) {
            top: 45%;
            left: 7%;
            animation-delay: 1s;
        }

        @keyframes starAnimation {
            0%,
            100% {
                opacity: 0;
                transform: scale(.5);
            }

            50% {
                opacity: .8;
                transform: scale(1.5);
            }
        }

        /* Conteúdo central */

        .intro-content {
            position: relative;
            z-index: 5;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;
        }

        /* =========================================
           CÍRCULO LARANJA
        ========================================= */

        .orange-circle {
            position: relative;

            width: 260px;
            height: 260px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffd27c 0%,
                    #ffad32 30%,
                    #ff7a00 68%,
                    #db4500 100%
                );

            box-shadow:
                0 0 25px rgba(255, 122, 0, .7),
                0 0 70px rgba(255, 98, 0, .35);

            opacity: 0;
            transform: scale(.15);

            animation:
                circleEnter 1.2s cubic-bezier(.17,.84,.44,1) forwards,
                circleFloat 3s ease-in-out 1.3s infinite;
        }

        .orange-circle::before {
            content: "";

            position: absolute;
            inset: -13px;

            border: 2px solid rgba(255, 168, 70, .25);
            border-radius: 50%;

            animation: ringPulse 2.2s ease-in-out infinite;
        }

        .orange-circle::after {
            content: "";

            position: absolute;
            inset: -28px;

            border: 1px solid rgba(255, 168, 70, .12);
            border-radius: 50%;

            animation: ringPulse 2.2s ease-in-out .5s infinite;
        }

        @keyframes circleEnter {
            0% {
                opacity: 0;
                transform: scale(.15) rotate(-12deg);
                filter: blur(10px);
            }

            70% {
                opacity: 1;
                transform: scale(1.08) rotate(2deg);
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes circleFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-9px);
            }
        }

        @keyframes ringPulse {
            0%,
            100% {
                transform: scale(.96);
                opacity: .25;
            }

            50% {
                transform: scale(1.05);
                opacity: .7;
            }
        }

        /* =========================================
           CHARIZARD BEBÊ
        ========================================= */

        .baby-charizard {
            position: relative;
            z-index: 2;

            font-size: 105px;

            opacity: 0;

            transform:
                translateY(20px)
                scale(.6);

            animation: charizardEnter .9s ease 1s forwards;
        }

        /*
          Placeholder temporário.
          Depois colocaremos a imagem do Charizard bebê aqui.
        */

        @keyframes charizardEnter {
            from {
                opacity: 0;
                transform:
                    translateY(30px)
                    scale(.6);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* =========================================
           LOGO
        ========================================= */

        .logo {
            margin-top: 38px;

            font-size: clamp(42px, 8vw, 72px);
            font-weight: 900;

            letter-spacing: 7px;

            opacity: 0;
            transform: translateY(20px);

            animation: logoEnter .8s ease 1.8s forwards;
        }

        .logo span:first-child {
            color: #ffffff;
        }

        .logo span:last-child {
            color: #ff8a00;

            text-shadow:
                0 0 12px rgba(255, 138, 0, .4);
        }

        @keyframes logoEnter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            margin-top: 9px;

            color: #9da5bd;

            font-size: 13px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 5px;

            opacity: 0;

            animation: subtitleEnter .8s ease 2.3s forwards;
        }

        @keyframes subtitleEnter {
            to {
                opacity: 1;
            }
        }

        /* =========================================
           BARRA DE CARREGAMENTO
        ========================================= */

        .loader {
            width: min(270px, 70vw);
            height: 4px;

            margin-top: 32px;

            background: rgba(255,255,255,.08);

            border-radius: 20px;

            overflow: hidden;

            opacity: 0;

            animation: loaderShow .4s ease 2.6s forwards;
        }

        .loader-bar {
            width: 0;
            height: 100%;

            background: linear-gradient(
                90deg,
                #ff6a00,
                #ffb52e
            );

            border-radius: 20px;

            box-shadow:
                0 0 12px rgba(255, 130, 0, .8);

            animation: loading 3.2s ease 2.8s forwards;
        }

        @keyframes loaderShow {
            to {
                opacity: 1;
            }
        }

        @keyframes loading {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }

        /* =========================================
           PULAR ABERTURA
        ========================================= */

        #skipIntro {
            position: absolute;

            right: 28px;
            bottom: 25px;

            z-index: 20;

            padding: 10px 18px;

            border: 1px solid rgba(255,255,255,.18);
            border-radius: 999px;

            background: rgba(255,255,255,.05);

            color: rgba(255,255,255,.7);

            font-size: 13px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition: .25s;
        }

        #skipIntro:hover {
            color: white;

            border-color: rgba(255, 138, 0, .7);

            background: rgba(255, 138, 0, .12);

            transform: translateY(-2px);
        }

        /* =========================================
           SAÍDA DA INTRO
        ========================================= */

        #intro.intro-out {
            animation: introOut .9s ease forwards;
        }

        @keyframes introOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* =========================================
           SITE
        ========================================= */

        #site {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;

            background:
                radial-gradient(
                    circle at top,
                    #171c34,
                    #090c18 60%
                );

            opacity: 0;
            transform: scale(1.02);

            transition:
                opacity .8s ease,
                transform .8s ease;
        }

        #site.visible {
            opacity: 1;
            transform: scale(1);
        }

        .home-logo {
            font-size: clamp(45px, 8vw, 80px);
            font-weight: 900;
            letter-spacing: 5px;
        }

        .home-logo span {
            color: #ff8a00;
        }

        .home-description {
            max-width: 650px;

            margin-top: 15px;

            color: #a9b0c4;

            text-align: center;

            font-size: 16px;
            line-height: 1.7;
        }

        .home-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;

            margin-top: 35px;
        }

        .home-button {
            padding: 14px 25px;

            border: none;
            border-radius: 12px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: .25s;
        }

        .primary {
            color: #161616;

            background:
                linear-gradient(
                    135deg,
                    #ffb02e,
                    #ff7500
                );
        }

        .secondary {
            color: white;

            background: #191e30;

            border: 1px solid #2b324b;
        }

        .home-button:hover {
            transform: translateY(-4px);
        }

        @media (max-width: 600px) {
            .orange-circle {
                width: 210px;
                height: 210px;
            }

            .baby-charizard {
                font-size: 85px;
            }

            #skipIntro {
                right: 15px;
                bottom: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================
         ABERTURA
    ====================================== -->

    <section id="intro">

        <div class="stars">
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
        </div>

        <div class="intro-content">

            <div class="orange-circle">

                <!--
                    🔥 TEMPORÁRIO
                    Aqui entraremos com nosso Charizard bebê.
                -->

                <div class="baby-charizard">
                    🔥
                </div>

            </div>

            <div class="logo">
                <span>WIKI</span><span>GAME</span>
            </div>

            <div class="subtitle">
                Explore • Descubra • Batalhe
            </div>

            <div class="loader">
                <div class="loader-bar"></div>
            </div>

        </div>

        <button id="skipIntro">
            Pular abertura →
        </button>

    </section>


    <!-- =====================================
         SITE PRINCIPAL
    ====================================== -->

    <main id="site">

        <div class="home-logo">
            WIKI<span>GAME</span>
        </div>

        <p class="home-description">
            Explore o mundo Pokémon, descubra informações
            sobre seus Pokémon favoritos e prepare seu time
            para batalhas.
        </p>

        <div class="home-buttons">

            <button class="home-button primary">
                Explorar Pokédex
            </button>

            <button class="home-button secondary">
                ⚔️ Batalhar
            </button>

        </div>

    </main>


    <script>
        const intro = document.getElementById("intro");
        const site = document.getElementById("site");
        const skipButton = document.getElementById("skipIntro");

        let introFinished = false;

        function finishIntro() {

            if (introFinished) return;

            introFinished = true;

            intro.classList.add("intro-out");

            setTimeout(() => {

                intro.style.display = "none";

                site.classList.add("visible");

                document.body.style.overflow = "auto";

            }, 850);
        }

        /*
            A abertura termina automaticamente.
        */

        const introTimer = setTimeout(() => {
            finishIntro();
        }, 6500);


        /*
            Botão para pular.
        */

        skipButton.addEventListener("click", () => {

            clearTimeout(introTimer);

            finishIntro();

        });
    </script>

</body>
</html>
