<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wiki | WikiGame</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="wiki-page">

        <header class="wiki-header">

            <a href="index.html" class="wiki-back">
                ← VOLTAR
            </a>

            <div class="wiki-title-area">
                <span class="wiki-small">
                    EXPLORE
                </span>

                <h1>
                    WIKI
                </h1>

                <p>
                    Pesquise e descubra informações sobre os Pokémon.
                </p>
            </div>

        </header>


        <section class="wiki-search-area">

            <div class="wiki-search-box">

                <input
                    type="text"
                    id="pokemon-search"
                    placeholder="Pesquisar Pokémon..."
                >

                <button id="pokemon-search-button">
                    BUSCAR
                </button>

            </div>

        </section>


        <section class="wiki-content">

            <div class="wiki-placeholder">

                <span class="wiki-placeholder-icon">
                    ◉
                </span>

                <h2>
                    Escolha um Pokémon
                </h2>

                <p>
                    Pesquise pelo nome para começar.
                </p>

            </div>

        </section>

    </main>

</body>

</html>
